name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag (example: v1.2.3). Defaults to the version in manifest.json."
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean
      generate_notes:
        description: "Auto-generate release notes"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build And Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize submodules (if configured)
        shell: bash
        run: |
          if [[ -f .gitmodules ]]; then
            git submodule sync --recursive
            git submodule update --init --recursive
          elif git ls-files --stage | awk '$1 == "160000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "::warning::Git submodule entries detected, but .gitmodules is missing. Skipping submodule initialization."
          else
            echo "No submodules configured."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: npm test

      - name: Run data normalizer unit tests
        run: npm run test:data-python

      - name: Audit shipped problem data
        run: npm run audit:problems

      - name: Build release artifacts
        run: |
          npm run build:chrome
          npm run build:firefox

      - name: Capture artifact paths
        id: artifacts
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          CHROME_ZIP_PATH="dist/rotblocker-plusplus-chrome-v${VERSION}.zip"
          FIREFOX_ZIP_PATH="dist/rotblocker-plusplus-firefox-v${VERSION}.zip"

          if [[ ! -f "${CHROME_ZIP_PATH}" ]]; then
            echo "::error::Expected Chrome release artifact not found at ${CHROME_ZIP_PATH}"
            exit 1
          fi
          if [[ ! -f "${FIREFOX_ZIP_PATH}" ]]; then
            echo "::error::Expected Firefox release artifact not found at ${FIREFOX_ZIP_PATH}"
            exit 1
          fi

          echo "chrome_zip_path=${CHROME_ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "firefox_zip_path=${FIREFOX_ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG_NAME: ${{ github.event.inputs.tag_name }}
          DISPATCH_PRERELEASE: ${{ github.event.inputs.prerelease }}
          DISPATCH_GENERATE_NOTES: ${{ github.event.inputs.generate_notes }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CREATE_TAG="false"
          PRERELEASE="false"
          GENERATE_NOTES="true"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            CREATE_TAG="true"

            if [[ -n "${DISPATCH_TAG_NAME}" ]]; then
              TAG="${DISPATCH_TAG_NAME}"
            else
              MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
              TAG="v${MANIFEST_VERSION}"
            fi

            if [[ "${DISPATCH_PRERELEASE}" == "true" ]]; then
              PRERELEASE="true"
            fi
            if [[ "${DISPATCH_GENERATE_NOTES}" == "false" ]]; then
              GENERATE_NOTES="false"
            fi
          fi

          if [[ -z "${TAG}" ]]; then
            echo "::error::No release tag available."
            exit 1
          fi
          if [[ "${TAG}" == *$'\n'* || "${TAG}" == *$'\r'* ]]; then
            echo "::error::Release tags cannot contain line breaks."
            exit 1
          fi

          printf 'tag_name=%s\n' "${TAG}" >> "$GITHUB_OUTPUT"
          printf 'create_tag=%s\n' "${CREATE_TAG}" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "${PRERELEASE}" >> "$GITHUB_OUTPUT"
          printf 'generate_notes=%s\n' "${GENERATE_NOTES}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches extension version
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          node scripts/validate_release_tag.js \
            "${RELEASE_TAG}" \
            manifest.json

      - name: Create and push release tag
        if: ${{ steps.release_meta.outputs.create_tag == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          TAG="${RELEASE_TAG}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            bash scripts/verify_release_tag_target.sh "${TAG}" "${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"

      - name: Upload release zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotblocker-plusplus-release-zips
          path: |
            ${{ steps.artifacts.outputs.chrome_zip_path }}
            ${{ steps.artifacts.outputs.firefox_zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.artifacts.outputs.chrome_zip_path }}
            ${{ steps.artifacts.outputs.firefox_zip_path }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ steps.release_meta.outputs.generate_notes == 'true' }}
